name: Webapp CI

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR so only the latest commit is tested.
concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        # --audit-level=high causes a non-zero exit when high/critical CVEs exist
        run: npm audit --audit-level=high

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client)
        run: npm --workspace client run typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/client/dist/
          retention-days: 7

  trivy-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    # Run in parallel with typecheck — does not depend on the build output
    needs: audit
    permissions:
      actions: read
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (vuln + secret, HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "webapp"
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          output: "trivy-webapp.sarif"
        env:
          # Avoids rate-limiting on GitHub-hosted runners
          TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db"

      - name: Upload SARIF to GitHub Security tab
        # Always upload even if the scan step above failed (exit-code: 1)
        # so findings appear in the Security tab before the job is marked failed.
        # Optional: requires Code Scanning/GHAS to be enabled in repository settings.
        if: ${{ always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-webapp.sarif
          category: webapp-trivy

      - name: Upload SARIF artifact (for manual inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-webapp-sarif
          path: trivy-webapp.sarif
          retention-days: 30
